<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="DocCare Online — modern doctor appointment platform for patients and healthcare professionals.">
<title>DocCare Online — Doctor Appointment Platform</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230c78ff'/%3E%3Cpath d='M32 17v30M17 32h30' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth">

    <div class="auth-card reveal" style="background:var(--white); box-shadow:0 30px 70px rgba(20,43,74,0.08); border:1px solid rgba(20,121,255,0.08); padding:clamp(24px, 4vw, 40px); border-radius:32px;">
        <div class="auth-brand">
            <a href="index.html" class="logo auth-logo">
                <div class="logo-mark"><svg viewBox="0 0 64 64" fill="none" stroke="var(--blue)" stroke-width="8" stroke-linecap="round" style="width: 24px; height: 24px;"><path d="M32 17v30M17 32h30"/></svg></div>
                <div class="logo-wordmark"><strong>DocCare</strong><em>Online</em></div>
            </a>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>
        
        <div id="panel-login" class="auth-panel">
            <h1>Welcome Back</h1>
            <p class="sub">Log in to manage your appointments and records.</p>
            <form class="form" onsubmit="event.preventDefault(); login();">
                <div>
                    <label>Email Address</label>
                    <input type="email" required placeholder="name@example.com">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <div class="remember-row">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:10px;width:100%">Log In</button>
            </form>
            <div class="divider">or continue with</div>
            <div class="socials">
                <button type="button" class="social-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545 10.239v3.821h5.445c-.712 2.315-2.647 3.972-5.445 3.972-3.332 0-6.033-2.701-6.033-6.032s2.701-6.032 6.033-6.032c1.498 0 2.866.549 3.921 1.453l2.814-2.814C17.503 2.988 15.139 2 12.545 2 7.021 2 2.545 6.477 2.545 12s4.476 10 10 10c5.522 0 10-4.477 10-10 0-1.213-.217-2.384-.616-3.483h-9.384z"/></svg>
                    Google
                </button>
                <button type="button" class="social-btn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
                    Facebook
                </button>
            </div>
            <div class="auth-foot">
                Don't have an account? <button type="button" class="text-link" onclick="switchTab('register')">Sign Up</button>
            </div>
        </div>

        <div id="panel-register" class="auth-panel" style="display:none">
            <h1>Create Account</h1>
            <p class="sub">Join thousands of patients who trust DocCare.</p>
            <form class="form" onsubmit="event.preventDefault(); switchTab('login'); toast('Account created! Please log in.');">
                <div>
                    <label>First Name</label>
                    <input type="text" required placeholder="John">
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" required placeholder="Doe">
                </div>
                <div>
                    <label>Email Address</label>
                    <input type="email" required placeholder="name@example.com">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" required placeholder="••••••••">
                </div>
                <label class="remember terms" style="margin-top:10px">
                    <input type="checkbox" required> <span>I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.</span>
                </label>
                <button type="submit" class="btn btn-primary" style="margin-top:10px;width:100%">Create Account</button>
            </form>
            <div class="auth-foot">
                Already have an account? <button type="button" class="text-link" onclick="switchTab('login')">Log In</button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
